cic_iot_2023:
  raw_path: "data/raw/cic_iot_2023/"
  file_glob: "Merged*.csv"
  processed_path: "data/processed/cic_iot_2023.parquet"

  label_column: "Label"

  # Measured 2026-09-01 across all 63 files. Headers verified byte-identical.
  n_files_expected: 63
  n_columns_expected: 40          # 39 numeric features + Label
  n_rows_expected: 45019243

  # Nine files (42, 44, 46, 47, 48, 49, 50, 51, 52) end on a truncated final
  # row — 9 malformed rows out of 45M. Verified against the source: the files
  # are otherwise complete, and Merged51/Merged52 are genuinely smaller
  # batches rather than partial downloads.
  #
  # Note on the mechanism: pandas PADS a short row with NaN rather than
  # rejecting it, so `on_bad_lines` never fires for these. They arrive with a
  # null Label and are dropped by the loader's null-label filter, which reports
  # them as `rows_dropped_null_label` (confirmed: exactly 9 on a full pass).
  # `on_bad_lines` still guards the other direction — rows with too many
  # fields — which is why it is set rather than left at the default.
  n_malformed_rows_expected: 9

  # Take 100% of every class below the cap, downsample the 24 classes above it.
  # Yields ~1,288,000 rows (24 caps + 88,479 tail rows) — comparable in size to
  # ACI, which keeps the two baselines on similar footing.
  # Set to null to stream all 45M rows for a final confirmation run.
  per_class_cap: 50000

  # raw.strip().upper()  ->  canonical name.
