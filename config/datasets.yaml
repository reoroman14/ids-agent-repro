# ---------------------------------------------------------------------------
# Splitting
# ---------------------------------------------------------------------------
split:
  seed: 42                        # fixed seed for reproducibility vs original paper numbers
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true

  # A class needs at least this many rows to be split three ways; below it the
  # class goes entirely to train and is absent from val/test.
  #
  # This exists for ACI's "ARP Spoofing", which has 5 rows in 1.23M. A 70/15/15
  # stratified split would give it 3/1/1 — unlearnable, and a single test row
  # makes its per-class F1 pure noise. At 100 rows a class still gets ~15 test
  # rows, which is the floor for a meaningful per-class score.
  #
  # Consequence to keep in mind when comparing to the paper: ACI trains on 12
  # classes but is evaluated on 11. Reported macro-F1 is over the classes
  # present in the test split. CIC is unaffected — its rarest class (Uploading
  # Attack, 1,196) splits to 837/179/180.
  min_rows_for_split: 100
  rare_class_policy: "train_only"   # train_only | drop | error

  # Zero-day evaluation hook (IDS-Agent reports ~0.61 zero-day recall).
  # Classes listed here are removed from train and val but kept in test, so the
  # model meets them for the first time at evaluation. Empty for the standard
  # Phase 1 baseline. Wired in now so Phase 2/3 need no data-layer refactor.
  holdout_classes: []

# ---------------------------------------------------------------------------
# Cleaning
# ---------------------------------------------------------------------------
cleaning:
  # Infinities are a genuine artifact of rate columns divided by a zero
  # duration, not a parse error. Measured over the full files:
  #   ACI  Flow Bytes/s   915 inf + 1,009 NaN
  #        Flow Packets/s 1,924 inf
  #   CIC  Rate           inf present; Std / Variance carry real NaN
  # Policy: inf -> NaN -> median impute, with the median fit on TRAIN ONLY and
  # reused for val/test so no test statistics leak into preprocessing.
  replace_inf_with_nan: true
  impute_strategy: "median"
  impute_fit_on: "train"

  # Columns with a single distinct value across the entire file carry no
  # signal. Measured over all 1,231,411 ACI rows (a 300k-row sample wrongly
  # flags four more — Fwd URG Flags, URG/CWR/ECE Flag Count — which do vary
  # later in the file, so this list must come from a full pass).
  # No constant columns were found in CIC.
  drop_zero_variance: true

  # Rows whose field count does not match the header. See
  # n_malformed_rows_expected above.
  on_bad_lines: "warn"
