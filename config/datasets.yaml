# Dataset configuration for Phase 1 baseline reproduction.
#
# Every number below was measured from the local raw files, not taken from
# dataset documentation. Regenerate with `python scripts/recount_labels.py`
# if the raw data is ever re-downloaded or re-split.
#
# Label handling is deliberately explicit: raw labels are normalized to an
# uppercase lookup key (`raw.strip().upper()`) and then mapped through
# `label_map` to a canonical name. An unmapped key is a hard error, never a
# silent pass-through — that is what stops an unnoticed 35th class from
# entering the results.

# ---------------------------------------------------------------------------
# ACI-IoT-2023
# ---------------------------------------------------------------------------
aci_iot_2023:
  raw_path: "data/raw/aci_iot_2023/"
  files: ["ACI-IoT-2023.csv"]
  processed_path: "data/processed/aci_iot_2023.parquet"

  label_column: "Label"

  # Measured 2026-09-01 from the local file.
  n_columns_expected: 85          # 83 numeric features + Label + Connection Type
  n_rows_expected: 1231411

  # No cap: the full dataset is 1.23M rows (~409 MB as float32) and fits in
  # memory comfortably. The cap exists to solve CIC's imbalance and memory
  # problem; ACI has neither. Set an integer here to enable capping.
  per_class_cap: null

  # raw.strip().upper()  ->  canonical name
  label_map:
    "BENIGN": "Benign"
    "PORT SCAN": "Port Scan"
    "ICMP FLOOD": "ICMP Flood"
    "PING SWEEP": "Ping Sweep"
    "DNS FLOOD": "DNS Flood"
    "VULNERABILITY SCAN": "Vulnerability Scan"
    "OS SCAN": "OS Scan"
    "SLOWLORIS": "Slowloris"
    "SYN FLOOD": "SYN Flood"
    "DICTIONARY ATTACK": "Dictionary Attack"
    "UDP FLOOD": "UDP Flood"
    "ARP SPOOFING": "ARP Spoofing"

  # canonical name -> coarse group (drives label_group / label_binary)
  label_groups:
    "Benign": "Benign"
    "Port Scan": "Recon"
    "ICMP Flood": "DoS"
    "Ping Sweep": "Recon"
    "DNS Flood": "DoS"
    "Vulnerability Scan": "Recon"
    "OS Scan": "Recon"
    "Slowloris": "DoS"
    "SYN Flood": "DoS"
    "Dictionary Attack": "Brute Force"
    "UDP Flood": "DoS"
    "ARP Spoofing": "Spoofing"

  # Frozen encoding order. Pinned so label -> int is identical across runs and
  # machines; do not reorder once results have been recorded.
  class_order:
    - "Benign"
    - "ARP Spoofing"
    - "DNS Flood"
    - "Dictionary Attack"
    - "ICMP Flood"
    - "OS Scan"
    - "Ping Sweep"
    - "Port Scan"
    - "SYN Flood"
    - "Slowloris"
    - "UDP Flood"
    - "Vulnerability Scan"

  # Measured row counts per canonical class. Used to validate the load and to
  # report sampling rates; the loader warns if observed counts drift.
  class_counts:
    "Port Scan": 441282
    "Benign": 329295
    "ICMP Flood": 225234
    "Ping Sweep": 71928
    "DNS Flood": 46935
    "Vulnerability Scan": 39537
    "OS Scan": 37524
    "Slowloris": 18643
    "SYN Flood": 13857
    "Dictionary Attack": 6380
    "UDP Flood": 791
    "ARP Spoofing": 5

# ---------------------------------------------------------------------------
# CIC-IoT-2023
